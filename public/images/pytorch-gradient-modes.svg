<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 330" width="990" height="330" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Normal autograd, no_grad, and inference_mode compared</title>
<desc id="diagram-desc">Normal forward records a backward graph. Both no_grad and inference_mode skip recording a backward graph. Inference mode also disables view tracking and version counter updates, but tensors created there have restrictions on subsequent gradient-tracked computation.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#253347}
.title{font-size:24px;font-weight:700}.sub{font-size:16px;fill:#53657a}.head{font-size:21px;font-weight:700}.body{font-size:17px}
.normal{fill:#eef2f7;stroke:#77879b;stroke-width:2}.no{fill:#edf5ff;stroke:#578bbd;stroke-width:2}.infer{fill:#eaf9f4;stroke:#119785;stroke-width:2}
.pillOn{fill:#fcebdc;stroke:#e0a15f}.pillOff{fill:#d9f3e9;stroke:#2aaf84}
</style>
<rect x="0" y="0" width="990" height="330" rx="18" fill="#ffffff"/>
<text x="24" y="37" class="title">Forward pass: what does PyTorch track?</text>
<text x="24" y="63" class="sub">All three run the forward computation. Only gradient bookkeeping differs.</text>
<g transform="translate(20,88)">
<rect width="300" height="210" rx="14" class="normal"/>
<text x="150" y="38" text-anchor="middle" class="head">Normal</text>
<text x="150" y="67" text-anchor="middle" class="body">y = model(x)</text>
<rect x="36" y="93" width="228" height="45" rx="9" class="pillOn"/>
<text x="150" y="122" text-anchor="middle" class="body">Autograd graph: ON</text>
<text x="150" y="166" text-anchor="middle" class="sub">Backward possible</text>
<text x="150" y="190" text-anchor="middle" class="sub">when gradients are enabled</text>
</g>
<g transform="translate(345,88)">
<rect width="300" height="210" rx="14" class="no"/>
<text x="150" y="38" text-anchor="middle" class="head">no_grad()</text>
<text x="150" y="67" text-anchor="middle" class="body">with torch.no_grad():</text>
<rect x="36" y="93" width="228" height="45" rx="9" class="pillOff"/>
<text x="150" y="122" text-anchor="middle" class="body">Autograd graph: OFF</text>
<text x="150" y="166" text-anchor="middle" class="sub">Normal tensor bookkeeping</text>
<text x="150" y="190" text-anchor="middle" class="sub">More flexible later</text>
</g>
<g transform="translate(670,88)">
<rect width="300" height="210" rx="14" class="infer"/>
<text x="150" y="38" text-anchor="middle" class="head">inference_mode()</text>
<text x="150" y="67" text-anchor="middle" class="body">with torch.inference_mode():</text>
<rect x="36" y="93" width="228" height="45" rx="9" class="pillOff"/>
<text x="150" y="122" text-anchor="middle" class="body">Autograd graph: OFF</text>
<text x="150" y="166" text-anchor="middle" class="sub">Less tensor bookkeeping</text>
<text x="150" y="190" text-anchor="middle" class="sub">Restricted backward reuse</text>
</g>
</svg>